name: Build and deploy Node.js app to Azure Web App - kinetic-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x' # Changed to a stable version Azure supports

      - name: npm install, build, and test
        working-directory: ./server # <--- Tells GitHub to enter the server folder
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server # <--- Only uploads your backend code, not the frontend

deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # 1. ADD THIS NEW ZIP STEP HERE:
      - name: Zip the application
        run: zip -r release.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_... }} # (Keep your secret IDs)
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_... }} 
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_... }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kinetic-backend'
          slot-name: 'Production'
          # 2. CHANGE THE PACKAGE TO YOUR NEW ZIP FILE:
          package: release.zip
