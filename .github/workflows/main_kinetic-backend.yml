name: Build and deploy Node.js app to Azure Web App - kinetic-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x' # Changed to 20.x (Azure recommended stable version)

      - name: npm install, build, and test
        working-directory: ./server # <--- Tells GitHub to enter the server folder
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server # <--- Only uploads your backend code, not the frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # --- ADDED THE ZIP TRICK HERE ---
      - name: Zip the application
        run: zip -r release.zip .

      - name: Login to Azure 
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A24256A93A0D4E51A3B7FEED3CBE7BC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_498F043B54864D83842D00C8CD5C6C92 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CEF9D4D600E145B39266D52B7ED2CF67 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kinetic-backend'
          slot-name: 'Production'
          package: release.zip # --- CHANGED PACKAGE TO use the zipped file ---
